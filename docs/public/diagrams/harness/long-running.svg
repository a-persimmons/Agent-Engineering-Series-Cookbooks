<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 590"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1250" height="590" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="625" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Long-running Task：把“持续运行”设计成阶段，而不是一个超长请求</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="60" y="180" width="150" height="88" rx="15"/><rect x="240" y="180" width="150" height="88" rx="15"/><rect x="420" y="180" width="150" height="88" rx="15"/><rect x="600" y="180" width="150" height="88" rx="15"/><rect x="780" y="180" width="150" height="88" rx="15"/><rect x="960" y="180" width="220" height="88" rx="15"/></g><g fill="#203129" text-anchor="middle" font-size="17" font-weight="700"><text x="135" y="232">Initialize</text><text x="315" y="232">Plan</text><text x="495" y="232">Execute Phase</text><text x="675" y="232">Checkpoint</text><text x="855" y="232">Compact</text><text x="1070" y="232">Re-evaluate / Next Phase</text></g><g stroke="#315c48" stroke-width="3" marker-end="url(#a)"><path d="M210 224H230"/><path d="M390 224H410"/><path d="M570 224H590"/><path d="M750 224H770"/><path d="M930 224H950"/></g><rect x="330" y="385" width="590" height="100" rx="20" fill="#e7f0eb" stroke="#315c48" stroke-width="2"/><text x="625" y="422" text-anchor="middle" font-size="20" font-weight="700" fill="#203129">Progress Artifact</text><text x="625" y="455" text-anchor="middle" font-size="16" fill="#52635b">Goal · Completed · Blocked · Decisions · Artifacts · Next</text><text x="625" y="535" text-anchor="middle" font-size="18" fill="#52635b">Paused 是正式状态：等待审批、外部系统、预算或用户，而不是“失败”。</text></g></svg>