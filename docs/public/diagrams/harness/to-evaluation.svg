<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540"><rect width="1200" height="540" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Harness 让失败受控；Evaluation 让失败变成下一版的资产</text><rect x="90" y="145" width="450" height="285" rx="22" fill="#fff" stroke="#315c48" stroke-width="2"/><rect x="660" y="145" width="450" height="285" rx="22" fill="#e7f0eb" stroke="#315c48" stroke-width="2"/><text x="315" y="195" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">Harness Engineering</text><text x="885" y="195" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">Evaluation Engineering</text><g text-anchor="middle" fill="#203129" font-size="17"><text x="315" y="250">Permission / Isolation / Limits</text><text x="315" y="290">Recovery / Persistence</text><text x="315" y="330">Observability / Audit</text><text x="315" y="370">让坏情况按设计失败</text><text x="885" y="250">Cases / Rubric / Signals</text><text x="885" y="290">Failure Taxonomy / Regression</text><text x="885" y="330">Production Feedback</text><text x="885" y="370">证明修复有效且不会复发</text></g><text x="600" y="300" text-anchor="middle" font-size="42" fill="#315c48">→</text><text x="600" y="490" text-anchor="middle" font-size="18" fill="#52635b">第四册问“系统怎样安全地坏”；第五册问“我们怎样系统地知道哪里坏，并持续改进”。</text></g></svg>