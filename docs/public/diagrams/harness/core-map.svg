<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 650"><rect width="1350" height="650" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="675" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Harness Engineering：把 Agent Loop 包进可执行的运行边界</text><rect x="335" y="155" width="680" height="330" rx="28" fill="#fff" stroke="#315c48" stroke-width="3"/><text x="675" y="200" text-anchor="middle" font-size="24" font-weight="700" fill="#315c48">Harness / Runtime Boundary</text><rect x="485" y="245" width="380" height="155" rx="22" fill="#e7f0eb" stroke="#315c48" stroke-width="2"/><text x="675" y="290" text-anchor="middle" font-size="23" font-weight="700" fill="#203129">Agent Loop</text><text x="675" y="330" text-anchor="middle" font-size="17" fill="#52635b">Context → Decision → Action</text><text x="675" y="360" text-anchor="middle" font-size="17" fill="#52635b">→ Observation → State → Feedback</text><g fill="#203129" text-anchor="middle" font-size="17" font-weight="700"><text x="430" y="225">Permission</text><text x="920" y="225">Isolation</text><text x="430" y="445">Recovery</text><text x="920" y="445">Persistence</text><text x="675" y="130">Validation · Limits</text><text x="675" y="525">Observability · Evaluation</text></g><text x="675" y="590" text-anchor="middle" font-size="18" fill="#52635b">Agent 决定“做什么”；Harness 决定“允许怎样做、失败后怎样安全继续”。</text></g></svg>