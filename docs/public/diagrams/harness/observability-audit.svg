<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570"><rect width="1200" height="570" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Observability 与 Audit 可以共享数据，但回答不同问题</text><rect x="80" y="145" width="460" height="320" rx="22" fill="#fff" stroke="#315c48" stroke-width="2"/><rect x="660" y="145" width="460" height="320" rx="22" fill="#fff" stroke="#315c48" stroke-width="2"/><text x="310" y="195" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">Observability</text><text x="890" y="195" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">Audit</text><text x="310" y="235" text-anchor="middle" font-size="18" fill="#315c48">“系统为什么这样运行？”</text><text x="890" y="235" text-anchor="middle" font-size="18" fill="#315c48">“谁在什么权限下做了什么？”</text><g fill="#e7f0eb" stroke="#315c48"><rect x="150" y="285" width="320" height="60" rx="12"/><rect x="150" y="370" width="320" height="60" rx="12"/><rect x="730" y="285" width="320" height="60" rx="12"/><rect x="730" y="370" width="320" height="60" rx="12"/></g><g fill="#203129" text-anchor="middle" font-size="16"><text x="310" y="322">Trace · State Diff · Cost · Duration</text><text x="310" y="407">Debug · Eval · Recovery</text><text x="890" y="322">Actor · Permission · Resource · Result</text><text x="890" y="407">Accountability · Compliance · Forensics</text></g><text x="600" y="520" text-anchor="middle" font-size="18" fill="#52635b">不是“记录越多越好”：两者都要处理敏感字段、访问控制与保留周期。</text></g></svg>