<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 590"><rect width="1250" height="590" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="625" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Permission、Isolation、Validation：三层边界解决三个不同问题</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="70" y="145" width="320" height="300" rx="22"/><rect x="465" y="145" width="320" height="300" rx="22"/><rect x="860" y="145" width="320" height="300" rx="22"/></g><g text-anchor="middle" fill="#203129"><text x="230" y="195" font-size="24" font-weight="700">Permission</text><text x="230" y="240" font-size="18">“能不能做？”</text><text x="230" y="290" font-size="16">资源 Scope</text><text x="230" y="325" font-size="16">Read / Write / High-risk</text><text x="230" y="360" font-size="16">Approval / Grant / Revoke</text><text x="625" y="195" font-size="24" font-weight="700">Isolation</text><text x="625" y="240" font-size="18">“在哪里做？”</text><text x="625" y="290" font-size="16">Filesystem / Process</text><text x="625" y="325" font-size="16">Network / Secret</text><text x="625" y="360" font-size="16">CPU / Memory / Workspace</text><text x="1020" y="195" font-size="24" font-weight="700">Validation</text><text x="1020" y="240" font-size="18">“这个动作合法吗？”</text><text x="1020" y="290" font-size="16">Schema / Business Rule</text><text x="1020" y="325" font-size="16">Path / Command Policy</text><text x="1020" y="360" font-size="16">Tool Result Validation</text></g><text x="625" y="515" text-anchor="middle" font-size="18" fill="#52635b">三层一起工作：有权限 ≠ 可以逃出沙箱；在沙箱里 ≠ 参数就一定合法。</text></g></svg>