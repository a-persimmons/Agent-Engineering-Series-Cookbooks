<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 620"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1250" height="620" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="625" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Timeout 之后不要立刻 Retry：先判断副作用状态</text><rect x="465" y="110" width="320" height="78" rx="17" fill="#315c48"/><text x="625" y="158" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Action 没收到明确结果</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="70" y="285" width="300" height="150" rx="20"/><rect x="475" y="285" width="300" height="150" rx="20"/><rect x="880" y="285" width="300" height="150" rx="20"/></g><g text-anchor="middle" fill="#203129"><text x="220" y="330" font-size="22" font-weight="700">确认未执行</text><text x="220" y="370" font-size="17">Transient Failure</text><text x="220" y="400" font-size="17">→ bounded retry / backoff</text><text x="625" y="330" font-size="22" font-weight="700">状态未知</text><text x="625" y="370" font-size="17">先 Reconcile / Query Status</text><text x="625" y="400" font-size="17">不能直接重放写操作</text><text x="1030" y="330" font-size="22" font-weight="700">确认已执行</text><text x="1030" y="370" font-size="17">更新 State / Journal</text><text x="1030" y="400" font-size="17">继续下一步</text></g><g stroke="#315c48" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M625 188V240"/><path d="M625 240H220V275"/><path d="M625 240V275"/><path d="M625 240H1030V275"/></g><rect x="340" y="495" width="570" height="68" rx="17" fill="#e7f0eb" stroke="#315c48"/><text x="625" y="538" text-anchor="middle" font-size="19" font-weight="700" fill="#203129">Idempotency Key / Operation Journal 让安全重放成为可能</text></g></svg>