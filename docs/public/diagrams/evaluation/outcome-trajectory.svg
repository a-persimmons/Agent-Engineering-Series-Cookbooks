<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Agent Eval：做对了，还要看“怎么做对的”</text><rect x="80" y="145" width="460" height="300" rx="22" fill="#fff" stroke="#315c48" stroke-width="2"/><rect x="660" y="145" width="460" height="300" rx="22" fill="#fff" stroke="#315c48" stroke-width="2"/><text x="310" y="195" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">Outcome</text><text x="890" y="195" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">Trajectory</text><g fill="#e7f0eb" stroke="#315c48"><rect x="145" y="255" width="330" height="60" rx="12"/><rect x="145" y="345" width="330" height="60" rx="12"/><rect x="725" y="255" width="330" height="60" rx="12"/><rect x="725" y="345" width="330" height="60" rx="12"/></g><g fill="#203129" text-anchor="middle" font-size="17"><text x="310" y="292">任务最终完成了吗？</text><text x="310" y="382">测试 / 结果 / 业务目标正确吗？</text><text x="890" y="292">Tool、参数、步骤、State 合理吗？</text><text x="890" y="382">有没有重复、越权、碰巧撞对？</text></g><text x="600" y="505" text-anchor="middle" font-size="18" fill="#52635b">不要要求唯一 Golden Trace；重点检查必要步骤、禁止动作和明显低效路径。</text></g></svg>