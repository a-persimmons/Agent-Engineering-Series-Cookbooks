<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 650"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1300" height="650" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="650" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">五册最终收束成一条从 Human Intent 到 Regression 的工程循环</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="65" y="155" width="180" height="85" rx="15"/><rect x="275" y="155" width="180" height="85" rx="15"/><rect x="485" y="155" width="180" height="85" rx="15"/><rect x="695" y="155" width="180" height="85" rx="15"/><rect x="905" y="155" width="180" height="85" rx="15"/></g><g fill="#203129" text-anchor="middle" font-size="17" font-weight="700"><text x="155" y="206">Prompt</text><text x="365" y="206">Context</text><text x="575" y="206">Agent</text><text x="785" y="206">Harness</text><text x="995" y="206">Evaluation</text></g><g stroke="#315c48" stroke-width="3" marker-end="url(#a)"><path d="M245 197H265"/><path d="M455 197H475"/><path d="M665 197H685"/><path d="M875 197H895"/></g><rect x="415" y="360" width="470" height="95" rx="20" fill="#315c48"/><text x="650" y="397" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Production Failure / Feedback</text><text x="650" y="428" text-anchor="middle" font-size="16" fill="#eaf2ee">找到第一次不可接受偏差发生在哪一层</text><path d="M995 240 C995 330 875 375 890 400" stroke="#315c48" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M415 407 C230 430 155 350 155 250" stroke="#315c48" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="650" y="545" text-anchor="middle" font-size="19" font-weight="700" fill="#203129">修复完成后留下 Regression，进入 Next Version</text><text x="650" y="580" text-anchor="middle" font-size="17" fill="#52635b">新模型、新框架、新 Pattern 都可以继续挂进这张图，而不必重新从零学习。</text></g></svg>