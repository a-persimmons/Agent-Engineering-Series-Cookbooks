<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Capability Eval 与 Regression Eval：一个爬坡，一个守住已经会的</text><rect x="80" y="150" width="460" height="300" rx="22" fill="#fff" stroke="#315c48" stroke-width="2"/><rect x="660" y="150" width="460" height="300" rx="22" fill="#e7f0eb" stroke="#315c48" stroke-width="2"/><text x="310" y="200" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">Capability Eval</text><text x="890" y="200" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">Regression Eval</text><g text-anchor="middle" fill="#203129" font-size="17"><text x="310" y="260">“现在能做到什么程度？”</text><text x="310" y="305">可以故意选当前较难的任务</text><text x="310" y="350">目标：找到可爬升的能力坡度</text><text x="890" y="260">“以前会的，现在还会吗？”</text><text x="890" y="305">关键历史 Case 应稳定通过</text><text x="890" y="350">目标：阻止改动破坏旧能力</text></g><text x="600" y="510" text-anchor="middle" font-size="18" fill="#52635b">能力成熟后，一部分 Capability Cases 会“毕业”进入 Regression Suite。</text></g></svg>