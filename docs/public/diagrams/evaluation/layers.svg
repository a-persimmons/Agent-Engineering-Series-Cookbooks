<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">一个 AI 系统有多层 Eval：先决定你在测哪一层</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="240" y="120" width="720" height="85" rx="18"/><rect x="285" y="225" width="630" height="85" rx="18"/><rect x="330" y="330" width="540" height="85" rx="18"/><rect x="375" y="435" width="450" height="85" rx="18"/></g><g text-anchor="middle" fill="#203129"><text x="600" y="158" font-size="23" font-weight="700">Production Layer</text><text x="600" y="187" font-size="16">真实用户 · 成本 · 延迟 · 人工介入 · Drift</text><text x="600" y="263" font-size="23" font-weight="700">Harness / Runtime Layer</text><text x="600" y="292" font-size="16">Permission · Timeout · Crash · Resume · Budget</text><text x="600" y="368" font-size="23" font-weight="700">Agent Trajectory Layer</text><text x="600" y="397" font-size="16">Tool · State · Loop · Stop · Feedback</text><text x="600" y="473" font-size="23" font-weight="700">Output / Context Layer</text><text x="600" y="502" font-size="16">最终结果 · 证据 · Missing / Noise / Stale</text></g><text x="600" y="585" text-anchor="middle" font-size="18" fill="#52635b">最终答案错了，不代表每次都应该改 Prompt；先找到第一次发生偏差的层。</text></g></svg>