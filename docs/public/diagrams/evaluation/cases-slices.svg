<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 610"><rect width="1250" height="610" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="625" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Dataset 不只是“题目集合”：Cases 覆盖风险，Slices 防止平均分掩盖问题</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="70" y="150" width="470" height="320" rx="22"/><rect x="710" y="150" width="470" height="320" rx="22"/></g><text x="305" y="195" text-anchor="middle" font-size="24" font-weight="700" fill="#203129">Case Types</text><text x="945" y="195" text-anchor="middle" font-size="24" font-weight="700" fill="#203129">Slices</text><g fill="#e7f0eb" stroke="#315c48"><rect x="130" y="240" width="160" height="55" rx="12"/><rect x="320" y="240" width="160" height="55" rx="12"/><rect x="130" y="325" width="160" height="55" rx="12"/><rect x="320" y="325" width="160" height="55" rx="12"/><rect x="770" y="240" width="160" height="55" rx="12"/><rect x="960" y="240" width="160" height="55" rx="12"/><rect x="770" y="325" width="160" height="55" rx="12"/><rect x="960" y="325" width="160" height="55" rx="12"/></g><g text-anchor="middle" fill="#203129" font-size="16" font-weight="700"><text x="210" y="274">Normal</text><text x="400" y="274">Edge</text><text x="210" y="359">Adversarial</text><text x="400" y="359">Historical Failure</text><text x="850" y="274">Risk Level</text><text x="1040" y="274">Task Type</text><text x="850" y="359">Input Length</text><text x="1040" y="359">Tool / Language</text></g><text x="625" y="535" text-anchor="middle" font-size="18" fill="#52635b">总体成功率上涨，不代表高风险 Slice 没有退化。</text></g></svg>