<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 600"><rect width="1250" height="600" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="625" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Grader Stack：不同判断交给最合适的测量工具</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="80" y="150" width="300" height="300" rx="22"/><rect x="475" y="150" width="300" height="300" rx="22"/><rect x="870" y="150" width="300" height="300" rx="22"/></g><g text-anchor="middle" fill="#203129"><text x="230" y="195" font-size="24" font-weight="700">Deterministic</text><text x="625" y="195" font-size="24" font-weight="700">LLM Judge</text><text x="1020" y="195" font-size="24" font-weight="700">Human Eval</text><text x="230" y="250" font-size="17">Schema / Tests / IDs</text><text x="230" y="285" font-size="17">Tool / Permission / Numeric</text><text x="230" y="330" font-size="17">快 · 稳定 · 便宜</text><text x="625" y="250" font-size="17">语义质量 / Rubric</text><text x="625" y="285" font-size="17">可规模化，但会偏</text><text x="625" y="330" font-size="17">必须 Calibration</text><text x="1020" y="250" font-size="17">高风险 / 主观偏好</text><text x="1020" y="285" font-size="17">新 Failure / Judge 校准</text><text x="1020" y="330" font-size="17">昂贵，但承担责任判断</text></g><text x="625" y="515" text-anchor="middle" font-size="18" fill="#52635b">能写成代码的先写成代码；Judge 补语义空白；人处理高风险、分歧和校准。</text></g></svg>