<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 570"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1400" height="570" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="700" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">RAG 不是“检索 + 拼接”，而是一条 Context Pipeline</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="45" y="160" width="145" height="88" rx="15"/><rect x="215" y="160" width="145" height="88" rx="15"/><rect x="385" y="160" width="145" height="88" rx="15"/><rect x="555" y="160" width="145" height="88" rx="15"/><rect x="725" y="160" width="145" height="88" rx="15"/><rect x="895" y="160" width="145" height="88" rx="15"/><rect x="1065" y="160" width="145" height="88" rx="15"/><rect x="1235" y="160" width="120" height="88" rx="15"/></g><g fill="#203129" text-anchor="middle" font-size="16" font-weight="700"><text x="117" y="212">Need</text><text x="287" y="212">Retrieve</text><text x="457" y="212">Filter</text><text x="627" y="212">Rerank</text><text x="797" y="212">Dedup</text><text x="967" y="212">Shape</text><text x="1137" y="212">Provenance</text><text x="1295" y="212">Context</text></g><g stroke="#315c48" stroke-width="2.6" marker-end="url(#a)"><path d="M190 204H205"/><path d="M360 204H375"/><path d="M530 204H545"/><path d="M700 204H715"/><path d="M870 204H885"/><path d="M1040 204H1055"/><path d="M1210 204H1225"/></g><rect x="365" y="365" width="670" height="100" rx="20" fill="#e7f0eb" stroke="#315c48"/><text x="700" y="403" text-anchor="middle" font-size="20" font-weight="700" fill="#203129">最终指标不是“搜到了多少”，而是模型是否因此做出更好的判断</text><text x="700" y="438" text-anchor="middle" font-size="16" fill="#52635b">Retrieval Quality · Context Quality · Outcome Quality</text></g></svg>