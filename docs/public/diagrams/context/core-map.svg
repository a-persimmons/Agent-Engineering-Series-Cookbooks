<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1400" height="520" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="700" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Context Engineering：每一轮只构造当前决策真正需要的工作集</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="45" y="150" width="160" height="92" rx="16"/><rect x="235" y="150" width="160" height="92" rx="16"/><rect x="425" y="150" width="160" height="92" rx="16"/><rect x="615" y="150" width="160" height="92" rx="16"/><rect x="805" y="150" width="160" height="92" rx="16"/><rect x="995" y="150" width="160" height="92" rx="16"/><rect x="1185" y="150" width="170" height="92" rx="16"/></g><g fill="#203129" text-anchor="middle"><text x="125" y="190" font-size="22" font-weight="700">Need</text><text x="125" y="218" font-size="15">现在缺什么</text><text x="315" y="190" font-size="22" font-weight="700">Source</text><text x="315" y="218" font-size="15">去哪里拿</text><text x="505" y="190" font-size="22" font-weight="700">Select</text><text x="505" y="218" font-size="15">哪些进入</text><text x="695" y="190" font-size="22" font-weight="700">Shape</text><text x="695" y="218" font-size="15">怎样表示</text><text x="885" y="190" font-size="22" font-weight="700">Budget</text><text x="885" y="218" font-size="15">注意力给谁</text><text x="1075" y="190" font-size="22" font-weight="700">Lifecycle</text><text x="1075" y="218" font-size="15">何时更新退出</text><text x="1270" y="190" font-size="22" font-weight="700">Evaluation</text><text x="1270" y="218" font-size="15">是否真的有帮助</text></g><g stroke="#315c48" stroke-width="3" marker-end="url(#a)"><path d="M205 196H225"/><path d="M395 196H415"/><path d="M585 196H605"/><path d="M775 196H795"/><path d="M965 196H985"/><path d="M1155 196H1175"/></g><rect x="405" y="345" width="590" height="92" rx="20" fill="#315c48"/><text x="700" y="383" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Runtime Context</text><text x="700" y="415" text-anchor="middle" font-size="17" fill="#eaf2ee">不是“系统拥有的全部信息”，而是这一轮模型实际看见的内容</text></g></svg>