<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 570"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1300" height="570" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="650" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Context 不是只会“加入”，还必须会换代和退出</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="55" y="160" width="150" height="90" rx="16"/><rect x="235" y="160" width="150" height="90" rx="16"/><rect x="415" y="160" width="150" height="90" rx="16"/><rect x="595" y="160" width="150" height="90" rx="16"/><rect x="775" y="160" width="150" height="90" rx="16"/><rect x="955" y="160" width="150" height="90" rx="16"/><rect x="1135" y="160" width="120" height="90" rx="16"/></g><g fill="#203129" text-anchor="middle" font-size="17" font-weight="700"><text x="130" y="214">产生</text><text x="310" y="214">进入</text><text x="490" y="214">使用</text><text x="670" y="214">写入 State</text><text x="850" y="214">压缩 / 降级</text><text x="1030" y="214">过期 / 刷新</text><text x="1195" y="214">退出</text></g><g stroke="#315c48" stroke-width="3" marker-end="url(#a)"><path d="M205 205H225"/><path d="M385 205H405"/><path d="M565 205H585"/><path d="M745 205H765"/><path d="M925 205H945"/><path d="M1105 205H1125"/></g><g fill="#e7f0eb" stroke="#315c48" stroke-width="1.5"><rect x="110" y="370" width="240" height="82" rx="16"/><rect x="395" y="370" width="240" height="82" rx="16"/><rect x="680" y="370" width="240" height="82" rx="16"/><rect x="965" y="370" width="240" height="82" rx="16"/></g><g fill="#203129" text-anchor="middle"><text x="230" y="402" font-size="18" font-weight="700">一轮有效</text><text x="230" y="430" font-size="15">工具原始返回</text><text x="515" y="402" font-size="18" font-weight="700">一个任务有效</text><text x="515" y="430" font-size="15">计划、候选假设</text><text x="800" y="402" font-size="18" font-weight="700">一个会话有效</text><text x="800" y="430" font-size="15">本次讨论目标</text><text x="1085" y="402" font-size="18" font-weight="700">长期有效</text><text x="1085" y="430" font-size="15">稳定偏好、固定约束</text></g><text x="650" y="515" text-anchor="middle" font-size="18" fill="#52635b">Freshness、source、ttl、version 不是元数据装饰，而是生命周期治理的一部分。</text></g></svg>