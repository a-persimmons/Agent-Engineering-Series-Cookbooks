<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Window、Runtime Context、Memory 是三个不同问题</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="70" y="145" width="300" height="245" rx="20"/><rect x="450" y="145" width="300" height="245" rx="20"/><rect x="830" y="145" width="300" height="245" rx="20"/></g><g fill="#203129" text-anchor="middle"><text x="220" y="190" font-size="24" font-weight="700">Context Window</text><text x="220" y="235" font-size="18">容量边界</text><text x="220" y="278" font-size="16">一次推理最多能容纳多少</text><text x="220" y="315" font-size="16">它不决定什么值得保留</text><text x="600" y="190" font-size="24" font-weight="700">Runtime Context</text><text x="600" y="235" font-size="18">当前工作集</text><text x="600" y="278" font-size="16">这一轮模型实际看见什么</text><text x="600" y="315" font-size="16">需要被动态选择与组织</text><text x="980" y="190" font-size="24" font-weight="700">Memory</text><text x="980" y="235" font-size="18">跨时间的信息机制</text><text x="980" y="278" font-size="16">什么值得留下</text><text x="980" y="315" font-size="16">何时重新带回 Runtime Context</text></g><text x="600" y="455" text-anchor="middle" font-size="18" fill="#52635b">大窗口 ≠ 好 Context；能保存 ≠ 应该每一轮都加载。</text></g></svg>