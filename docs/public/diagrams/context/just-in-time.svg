<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 590"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1250" height="590" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="625" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Just-in-time Context：发现信息缺口，再为下一步补材料</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="80" y="170" width="200" height="95" rx="16"/><rect x="330" y="170" width="200" height="95" rx="16"/><rect x="580" y="170" width="200" height="95" rx="16"/><rect x="830" y="170" width="200" height="95" rx="16"/></g><g fill="#203129" text-anchor="middle" font-size="18" font-weight="700"><text x="180" y="225">Current Context</text><text x="430" y="210">发现缺口</text><text x="430" y="238">Need</text><text x="680" y="210">Tool / Retrieval</text><text x="680" y="238">按需获取</text><text x="930" y="210">Next Context</text><text x="930" y="238">只带回必要结果</text></g><g stroke="#315c48" stroke-width="3" marker-end="url(#a)"><path d="M280 217H320"/><path d="M530 217H570"/><path d="M780 217H820"/></g><path d="M930 265 C930 420 180 420 180 275" stroke="#315c48" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="345" y="430" width="560" height="85" rx="18" fill="#e7f0eb" stroke="#315c48"/><text x="625" y="465" text-anchor="middle" font-size="20" font-weight="700" fill="#203129">不是所有信息都值得提前加载</text><text x="625" y="495" text-anchor="middle" font-size="16" fill="#52635b">稳定规则常驻 · 当前 State 维护 · 大量事实按需获取 · 原始结果及时退出</text></g></svg>