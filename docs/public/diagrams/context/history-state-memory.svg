<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1200" height="590" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">History、Task State、Long-term Memory：不要混成一个桶</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="70" y="145" width="290" height="250" rx="20"/><rect x="455" y="145" width="290" height="250" rx="20"/><rect x="840" y="145" width="290" height="250" rx="20"/></g><g fill="#203129" text-anchor="middle"><text x="215" y="190" font-size="24" font-weight="700">History</text><text x="215" y="235" font-size="18">之前发生过什么</text><text x="215" y="285" font-size="16">对话、动作、原始过程</text><text x="215" y="330" font-size="16">默认不是长期事实库</text><text x="600" y="190" font-size="24" font-weight="700">Task State</text><text x="600" y="235" font-size="18">任务现在在哪里</text><text x="600" y="285" font-size="16">Goal、进度、阻塞、下一步</text><text x="600" y="330" font-size="16">服务于当前决策与恢复</text><text x="985" y="190" font-size="24" font-weight="700">Long-term Memory</text><text x="985" y="235" font-size="18">未来还值得再用什么</text><text x="985" y="285" font-size="16">稳定事实、重要决策、经验</text><text x="985" y="330" font-size="16">需要写入、检索、更新、遗忘</text></g><g stroke="#315c48" stroke-width="3" marker-end="url(#a)"><path d="M360 270H445"/><path d="M745 270H830"/></g><text x="600" y="480" text-anchor="middle" font-size="18" fill="#52635b">信息可以从 History 提炼进 State，再在确有长期价值时进入 Memory。</text><text x="600" y="518" text-anchor="middle" font-size="18" fill="#52635b">这个过程不是自动升级：每一步都需要新的使用理由。</text></g></svg>