<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 680"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#a25543"/></marker></defs><rect width="1300" height="680" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="650" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Context Debugging：模型做错时，先还原“它当时看见了什么”</text><rect x="500" y="110" width="300" height="72" rx="16" fill="#fff1ed" stroke="#a25543" stroke-width="2"/><text x="650" y="155" text-anchor="middle" font-size="21" font-weight="700" fill="#743b30">Production Failure</text><g fill="#fff" stroke="#a25543" stroke-width="2"><rect x="70" y="275" width="150" height="92" rx="14"/><rect x="240" y="275" width="150" height="92" rx="14"/><rect x="410" y="275" width="150" height="92" rx="14"/><rect x="580" y="275" width="150" height="92" rx="14"/><rect x="750" y="275" width="150" height="92" rx="14"/><rect x="920" y="275" width="150" height="92" rx="14"/><rect x="1090" y="275" width="150" height="92" rx="14"/></g><g fill="#743b30" text-anchor="middle" font-size="17" font-weight="700"><text x="145" y="315">Evaluation</text><text x="145" y="340">没发现？</text><text x="315" y="315">Lifecycle</text><text x="315" y="340">旧信息没退？</text><text x="485" y="315">Budget</text><text x="485" y="340">被噪声淹没？</text><text x="655" y="315">Shape</text><text x="655" y="340">形态难用？</text><text x="825" y="315">Select</text><text x="825" y="340">选错 / 漏选？</text><text x="995" y="315">Source</text><text x="995" y="340">事实源有误？</text><text x="1165" y="315">Need</text><text x="1165" y="340">需求判断错？</text></g><g stroke="#a25543" stroke-width="2.6" fill="none" marker-end="url(#a)"><path d="M650 182V230"/><path d="M650 230H145V265"/><path d="M650 230H315V265"/><path d="M650 230H485V265"/><path d="M650 230V265"/><path d="M650 230H825V265"/><path d="M650 230H995V265"/><path d="M650 230H1165V265"/></g><rect x="270" y="470" width="760" height="120" rx="20" fill="#e7f0eb" stroke="#315c48" stroke-width="2"/><text x="650" y="512" text-anchor="middle" font-size="21" font-weight="700" fill="#203129">调试前提：Context Trace</text><text x="650" y="548" text-anchor="middle" font-size="17" fill="#52635b">Goal / State · History · Memory · Retrieval · Tool Result · 被压缩或删除的内容</text><text x="650" y="577" text-anchor="middle" font-size="17" fill="#52635b">如果无法回答“模型当时到底看见了什么”，Context Debugging 就只能靠猜。</text></g></svg>