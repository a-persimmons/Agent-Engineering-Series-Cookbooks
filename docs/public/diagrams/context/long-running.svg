<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"><rect width="1200" height="600" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Long-running Context：三层分工，不让历史无限堆进当前工作区</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="90" y="150" width="300" height="300" rx="22"/><rect x="450" y="150" width="300" height="300" rx="22"/><rect x="810" y="150" width="300" height="300" rx="22"/></g><g fill="#203129" text-anchor="middle"><text x="240" y="195" font-size="25" font-weight="700">Durable State</text><text x="240" y="240" font-size="18">跨阶段必须保留</text><text x="240" y="285" font-size="16">Goal</text><text x="240" y="318" font-size="16">已完成里程碑</text><text x="240" y="351" font-size="16">关键决策 / 风险</text><text x="240" y="384" font-size="16">Next Action</text><text x="600" y="195" font-size="25" font-weight="700">Working Context</text><text x="600" y="240" font-size="18">当前阶段正在使用</text><text x="600" y="285" font-size="16">相关文件</text><text x="600" y="318" font-size="16">当前假设</text><text x="600" y="351" font-size="16">关键证据</text><text x="600" y="384" font-size="16">最近工具结果</text><text x="960" y="195" font-size="25" font-weight="700">Archive</text><text x="960" y="240" font-size="18">默认不进模型</text><text x="960" y="285" font-size="16">原始日志</text><text x="960" y="318" font-size="16">旧工具输出</text><text x="960" y="351" font-size="16">放弃分支</text><text x="960" y="384" font-size="16">保留可回查指针</text></g><text x="600" y="515" text-anchor="middle" font-size="18" fill="#52635b">Compaction 的目标不是“把一切变短”，而是完成一次可靠交接。</text></g></svg>