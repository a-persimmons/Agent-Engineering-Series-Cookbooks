<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><defs><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker><marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#a25543"/></marker></defs><rect width="1200" height="560" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="80" y="70" font-size="25" font-weight="700" fill="#315c48">设计：从左往右，把任务逐步说清楚</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="65" y="125" width="150" height="78" rx="14"/><rect x="250" y="125" width="150" height="78" rx="14"/><rect x="435" y="125" width="150" height="78" rx="14"/><rect x="620" y="125" width="150" height="78" rx="14"/><rect x="805" y="125" width="150" height="78" rx="14"/><rect x="990" y="125" width="150" height="78" rx="14"/></g><g fill="#203129" text-anchor="middle" font-size="19" font-weight="700"><text x="140" y="173">Goal</text><text x="325" y="173">Context</text><text x="510" y="173">Process</text><text x="695" y="173">Output</text><text x="880" y="173">Constraints</text><text x="1065" y="173">Evaluation</text></g><g stroke="#315c48" stroke-width="3" marker-end="url(#g)"><path d="M215 164H240"/><path d="M400 164H425"/><path d="M585 164H610"/><path d="M770 164H795"/><path d="M955 164H980"/></g><text x="80" y="310" font-size="25" font-weight="700" fill="#a25543">调试：从失败出发，找到第一次偏离的层</text><rect x="65" y="355" width="150" height="78" rx="14" fill="#fff1ed" stroke="#a25543" stroke-width="2"/><text x="140" y="403" text-anchor="middle" font-size="19" font-weight="700" fill="#743b30">Failure</text><g fill="#fff" stroke="#a25543" stroke-width="2"><rect x="250" y="355" width="150" height="78" rx="14"/><rect x="435" y="355" width="150" height="78" rx="14"/><rect x="620" y="355" width="150" height="78" rx="14"/><rect x="805" y="355" width="150" height="78" rx="14"/><rect x="990" y="355" width="150" height="78" rx="14"/></g><g fill="#743b30" text-anchor="middle" font-size="18" font-weight="700"><text x="325" y="392">Evaluation</text><text x="325" y="417">看见问题了吗</text><text x="510" y="392">边界 / Output</text><text x="510" y="417">是否失效</text><text x="695" y="392">Process</text><text x="695" y="417">是否走偏</text><text x="880" y="392">Context</text><text x="880" y="417">是否缺/乱</text><text x="1065" y="392">Goal</text><text x="1065" y="417">是否一开始就错</text></g><g stroke="#a25543" stroke-width="3" marker-end="url(#r)"><path d="M215 394H240"/><path d="M400 394H425"/><path d="M585 394H610"/><path d="M770 394H795"/><path d="M955 394H980"/></g><text x="600" y="515" text-anchor="middle" font-size="19" fill="#52635b">同一张地图既是设计框架，也是 Debug 路由器。</text></g></svg>