<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Prompt Engineering 六问总地图</title><desc id="d">Goal、Context、Process、Output、Constraints、Evaluation 六问地图。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#315c48"/></marker></defs><rect width="1200" height="520" rx="28" fill="#f5f9f7"/><text x="600" y="62" text-anchor="middle" font-family="system-ui,Segoe UI,PingFang SC,sans-serif" font-size="28" font-weight="700" fill="#203129">一个 AI 任务，不先找技巧，先回答六个问题</text><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="70" y="130" width="290" height="105" rx="18"/><rect x="455" y="130" width="290" height="105" rx="18"/><rect x="840" y="130" width="290" height="105" rx="18"/><rect x="260" y="325" width="290" height="105" rx="18"/><rect x="650" y="325" width="290" height="105" rx="18"/></g><g fill="#203129" text-anchor="middle"><text x="215" y="172" font-size="24" font-weight="700">Goal</text><text x="215" y="205" font-size="18">到底要完成什么？</text><text x="600" y="172" font-size="24" font-weight="700">Context</text><text x="600" y="205" font-size="18">模型必须知道什么？</text><text x="985" y="172" font-size="24" font-weight="700">Process</text><text x="985" y="205" font-size="18">哪些过程值得控制？</text><text x="405" y="367" font-size="24" font-weight="700">Output</text><text x="405" y="400" font-size="18">最终交付什么？</text><text x="795" y="367" font-size="24" font-weight="700">Constraints</text><text x="795" y="400" font-size="18">边界和失败路径是什么？</text></g><rect x="455" y="455" width="290" height="52" rx="16" fill="#315c48"/><text x="600" y="489" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Evaluation · 怎样证明它真的好？</text><g stroke="#315c48" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M360 182 H445"/><path d="M745 182 H830"/><path d="M985 235 C985 285 910 300 850 320"/><path d