<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1200" height="520" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Few-shot 的价值：让模型看见“边界”</text><rect x="85" y="140" width="260" height="210" rx="18" fill="#fff" stroke="#315c48" stroke-width="2"/><rect x="470" y="140" width="260" height="210" rx="18" fill="#e7f0eb" stroke="#315c48" stroke-width="2"/><rect x="855" y="140" width="260" height="210" rx="18" fill="#fff1ed" stroke="#a25543" stroke-width="2"/><g text-anchor="middle" fill="#203129"><text x="215" y="182" font-size="23" font-weight="700">代表例</text><text x="215" y="225" font-size="18">最常见任务形态</text><text x="215" y="260" font-size="17">告诉模型“通常怎样”</text><text x="600" y="182" font-size="23" font-weight="700">边界例</text><text x="600" y="225" font-size="18">最容易混淆的位置</text><text x="600" y="260" font-size="17">告诉模型“从哪里开始算错”</text><text x="985" y="182" font-size="23" font-weight="700">反例</text><text x="985" y="225" font-size="18">看似合理但不合格</text><text x="985" y="260" font-size="17">告诉模型“什么不要学”</text></g><g stroke="#315c48" stroke-width="3" marker-end="url(#a)"><path d="M345 245H460"/><path d="M730 245H845"/></g><rect x="345" y="405" width="510" height="65" rx="16" fill="#315c48"/><text x="600" y="447" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">例子属于 Context：目标是表达任务分布，不是凑数量</text></g></svg>