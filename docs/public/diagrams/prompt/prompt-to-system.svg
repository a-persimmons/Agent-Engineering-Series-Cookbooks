<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">当规则可以被程序强制执行，就不要永远留在 Prompt 里</text><rect x="80" y="145" width="460" height="300" rx="22" fill="#fff" stroke="#315c48" stroke-width="2"/><rect x="660" y="145" width="460" height="300" rx="22" fill="#e7f0eb" stroke="#315c48" stroke-width="2"/><text x="310" y="195" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">Prompt Layer</text><text x="890" y="195" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">System / Harness Layer</text><text x="310" y="250" text-anchor="middle" font-size="18" fill="#315c48">表达意图与行为要求</text><text x="890" y="250" text-anchor="middle" font-size="18" fill="#315c48">把确定边界变成运行事实</text><g fill="#203129" text-anchor="middle" font-size="17"><text x="310" y="310">“不要访问工作区之外”</text><text x="310" y="350">“请在预算内完成”</text><text x="310" y="390">依赖模型遵守</text><text x="890" y="310">Path Scope Hard Reject</text><text x="890" y="350">Max Steps / Cost / Timeout</text><text x="890" y="390">即使模型判断错，边界仍存在</text></g><text x="600" y="500" text-anchor="middle" font-size="18" fill="#52635b">成熟 Prompt Engineering 的一部分，是知道什么时候停止继续优化 Prompt。</text></g></svg>