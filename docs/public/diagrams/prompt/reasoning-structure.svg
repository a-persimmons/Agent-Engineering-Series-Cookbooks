<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1200" height="560" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="62" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Reasoning 不是“多想一会儿”，而是设计可检查的中间结构</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="70" y="170" width="180" height="90" rx="16"/><rect x="300" y="170" width="180" height="90" rx="16"/><rect x="530" y="170" width="180" height="90" rx="16"/><rect x="760" y="170" width="180" height="90" rx="16"/><rect x="990" y="170" width="140" height="90" rx="16"/></g><g fill="#203129" text-anchor="middle" font-size="18" font-weight="700"><text x="160" y="223">现象 / 输入</text><text x="390" y="210">候选</text><text x="390" y="235">假设</text><text x="620" y="210">支持 / 反对</text><text x="620" y="235">证据</text><text x="850" y="210">比较 /</text><text x="850" y="235">筛选</text><text x="1060" y="223">结论</text></g><g stroke="#315c48" stroke-width="3" marker-end="url(#a)"><path d="M250 215H290"/><path d="M480 215H520"/><path d="M710 215H750"/><path d="M940 215H980"/></g><rect x="250" y="365" width="700" height="110" rx="18" fill="#e7f0eb" stroke="#315c48" stroke-width="2"/><text x="600" y="405" text-anchor="middle" font-size="21" font-weight="700" fill="#203129">真正值得保留的是任务中间产物</text><text x="600" y="440" text-anchor="middle" font-size="17" fill="#52635b">哪些假设、哪些证据、下一步要验证什么——这些能被人和程序检查。</text></g></svg>