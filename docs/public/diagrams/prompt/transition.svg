<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1200" height="520" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Prompt 没有失效，只是被更大的运行时问题包住了</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="80" y="135" width="190" height="140" rx="18"/><rect x="300" y="135" width="190" height="140" rx="18"/><rect x="520" y="135" width="190" height="140" rx="18"/><rect x="740" y="135" width="190" height="140" rx="18"/><rect x="960" y="135" width="190" height="140" rx="18"/></g><g fill="#203129" text-anchor="middle"><text x="175" y="174" font-size="21" font-weight="700">Prompt</text><text x="175" y="205" font-size="16">控制一次</text><text x="175" y="230" font-size="16">模型行为</text><text x="395" y="174" font-size="21" font-weight="700">Context</text><text x="395" y="205" font-size="16">控制这一轮</text><text x="395" y="230" font-size="16">模型看到什么</text><text x="615" y="174" font-size="21" font-weight="700">Agent</text><text x="615" y="205" font-size="16">控制持续的</text><text x="615" y="230" font-size="16">决策与行动</text><text x="835" y="174" font-size="21" font-weight="700">Harness</text><text x="835" y="205" font-size="16">让行动长期</text><text x="835" y="230" font-size="16">可控、可恢复</text><text x="1055" y="174" font-size="21" font-weight="700">Evaluation</text><text x="1055" y="205" font-size="16">证明系统</text><text x="1055" y="230" font-size="16">真的变好</text></g><g stroke="#315c48" stroke-width="3" marker-end="url(#a)"><path d="M270 205H290"/><path d="M490 205H510"/><path d="M710 205H730"/><path d="M930 205H950"/></g><rect x="220" y="355" width="760" height="90" rx="18" fill="#e7f0eb" stroke="#315c48" stroke-width="2"/><text x="600" y="392" text-anchor="middle" font-size="21" font-weight="700" fill="#203129">尺度在扩大，但最初那六个问题仍然存在</text><text x="600" y="422" text-anchor="middle" font-size="17" fill="#52635b">后面的每一层都继续使用 Prompt，只是不再让 Prompt 独自承担整个系统。</text></g></svg>