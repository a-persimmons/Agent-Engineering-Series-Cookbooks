<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1300" height="620" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="650" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Agent Engineering：把一次判断变成持续推进任务的 Loop</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="75" y="160" width="150" height="90" rx="16"/><rect x="255" y="160" width="150" height="90" rx="16"/><rect x="435" y="160" width="150" height="90" rx="16"/><rect x="615" y="160" width="150" height="90" rx="16"/><rect x="795" y="160" width="150" height="90" rx="16"/><rect x="975" y="160" width="150" height="90" rx="16"/></g><g fill="#203129" text-anchor="middle" font-size="18" font-weight="700"><text x="150" y="214">Context</text><text x="330" y="214">Decision</text><text x="510" y="214">Action</text><text x="690" y="214">Observation</text><text x="870" y="214">State</text><text x="1050" y="214">Feedback</text></g><g stroke="#315c48" stroke-width="3" marker-end="url(#a)"><path d="M225 205H245"/><path d="M405 205H425"/><path d="M585 205H605"/><path d="M765 205H785"/><path d="M945 205H965"/></g><path d="M1050 250 C1050 430 150 430 150 260" stroke="#315c48" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="470" y="440" width="360" height="82" rx="18" fill="#315c48"/><text x="650" y="475" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Goal + Stop Criteria</text><text x="650" y="504" text-anchor="middle" font-size="16" fill="#eaf2ee">一直约束 Loop：继续、改计划、求助或停止</text><text x="650" y="580" text-anchor="middle" font-size="17" fill="#52635b">Model 主要位于 Decision；Agent Engineering 研究的是 Decision 前后的整条运行链。</text></g></svg>