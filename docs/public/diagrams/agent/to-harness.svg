<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">一个能做事的 Agent，还不是一个可以长期信任的系统</text><rect x="120" y="140" width="390" height="310" rx="24" fill="#fff" stroke="#315c48" stroke-width="2"/><rect x="690" y="140" width="390" height="310" rx="24" fill="#e7f0eb" stroke="#315c48" stroke-width="2"/><text x="315" y="190" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">Agent Engineering</text><text x="885" y="190" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">Harness Engineering</text><g text-anchor="middle" fill="#203129" font-size="17"><text x="315" y="245">下一步做什么？</text><text x="315" y="285">调用哪个 Tool？</text><text x="315" y="325">结果意味着什么？</text><text x="315" y="365">继续 / Replan / Stop？</text><text x="885" y="245">允许做什么？在哪里做？</text><text x="885" y="285">最多多久 / 几步 / 多少钱？</text><text x="885" y="325">崩溃、超时、重复副作用怎么办？</text><text x="885" y="365">如何恢复、追踪、审计？</text></g><text x="600" y="305" text-anchor="middle" font-size="42" fill="#315c48">→</text><text x="600" y="510" text-anchor="middle" font-size="18" fill="#52635b">第三册设计行为逻辑；第四册把行为逻辑变成真实运行时保证。</text></g></svg>