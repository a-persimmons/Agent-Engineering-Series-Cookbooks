<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="600" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Workflow 还是 Agent：关键看“下一步能不能提前写清楚”</text><rect x="70" y="135" width="470" height="330" rx="22" fill="#fff" stroke="#315c48" stroke-width="2"/><rect x="660" y="135" width="470" height="330" rx="22" fill="#fff" stroke="#315c48" stroke-width="2"/><text x="305" y="185" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">Workflow</text><text x="895" y="185" text-anchor="middle" font-size="25" font-weight="700" fill="#203129">Agent</text><text x="305" y="230" text-anchor="middle" font-size="18" fill="#315c48">控制流主要由程序预先定义</text><text x="895" y="230" text-anchor="middle" font-size="18" fill="#315c48">部分控制流在运行时由模型决定</text><g fill="#e7f0eb" stroke="#315c48"><rect x="145" y="285" width="320" height="55" rx="12"/><rect x="145" y="365" width="320" height="55" rx="12"/><rect x="735" y="285" width="320" height="55" rx="12"/><rect x="735" y="365" width="320" height="55" rx="12"/></g><g text-anchor="middle" fill="#203129" font-size="17"><text x="305" y="319">步骤 / 顺序 / 失败路径较确定</text><text x="305" y="399">更易测试、复现、控成本</text><text x="895" y="319">中间结果会改变下一步路径</text><text x="895" y="399">更灵活，也带来更大的测试空间</text></g><text x="600" y="520" text-anchor="middle" font-size="18" fill="#52635b">Agent 不是 Workflow 的“高级版”；它只是把更多 Decision 留到运行时。</text></g></svg>