<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 640"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1250" height="640" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="625" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Subagent / Multi-Agent：真正增加的是 Loop 之间的边界与协调</text><rect x="470" y="120" width="310" height="100" rx="20" fill="#315c48"/><text x="625" y="164" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Main / Supervisor Loop</text><text x="625" y="194" text-anchor="middle" font-size="16" fill="#eaf2ee">Global Goal · Plan · State Ownership</text><g fill="#fff" stroke="#315c48" stroke-width="2"><rect x="80" y="350" width="270" height="150" rx="18"/><rect x="490" y="350" width="270" height="150" rx="18"/><rect x="900" y="350" width="270" height="150" rx="18"/></g><g fill="#203129" text-anchor="middle"><text x="215" y="395" font-size="22" font-weight="700">Search Loop</text><text x="215" y="430" font-size="16">局部 Context / 只读 Tool</text><text x="215" y="463" font-size="16">返回 Result + Evidence</text><text x="625" y="395" font-size="22" font-weight="700">Execution Loop</text><text x="625" y="430" font-size="16">局部 Action / Artifacts</text><text x="625" y="463" font-size="16">返回 Status + Changes</text><text x="1035" y="395" font-size="22" font-weight="700">Review Loop</text><text x="1035" y="430" font-size="16">局部 Rubric / Feedback</text><text x="1035" y="463" font-size="16">返回 Issues + Decision</text></g><g stroke="#315c48" stroke-width="3" marker-end="url(#a)"><path d="M550 220C450 275 290 300 235 340"/><path d="M625 220V340"/><path d="M700 220C800 275 960 300 1015 340"/></g><text x="625" y="565" text-anchor="middle" font-size="18" fill="#52635b">不要交换全部历史。交换任务合同、结构化产物、证据、状态与未决问题。</text></g></svg>