<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 580"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#315c48"/></marker></defs><rect width="1260" height="580" rx="28" fill="#f5f9f7"/><g font-family="system-ui,Segoe UI,PingFang SC,sans-serif"><text x="630" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#203129">Tool 是模型与业务系统之间的语义适配层</text><rect x="60" y="150" width="250" height="260" rx="22" fill="#fff" stroke="#315c48" stroke-width="2"/><rect x="505" y="150" width="250" height="260" rx="22" fill="#e7f0eb" stroke="#315c48" stroke-width="2"/><rect x="950" y="150" width="250" height="260" rx="22" fill="#fff" stroke="#315c48" stroke-width="2"/><text x="185" y="195" text-anchor="middle" font-size="24" font-weight="700" fill="#203129">Agent Decision</text><text x="630" y="195" text-anchor="middle" font-size="24" font-weight="700" fill="#203129">Tool Contract</text><text x="1075" y="195" text-anchor="middle" font-size="24" font-weight="700" fill="#203129">Business System</text><g fill="#203129" text-anchor="middle" font-size="16"><text x="185" y="250">我要完成什么业务动作？</text><text x="185" y="290">需要什么参数？</text><text x="185" y="330">结果如何影响下一步？</text><text x="630" y="245">清晰名称 / 语义粒度</text><text x="630" y="285">参数 Schema / 副作用</text><text x="630" y="325">成功 / 错误 / 可重试语义</text><text x="1075" y="250">HTTP / DB / Shell / SaaS</text><text x="1075" y="290">内部枚举 / Header / Auth</text><text x="1075" y="330">复杂实现细节</text></g><g stroke="#315c48" stroke-width="3" marker-end="url(#a)"><path d="M310 280H495"/><path d="M755 280H940"/></g><text x="630" y="485" text-anchor="middle" font-size="18" fill="#52635b">MCP 可以标准化能力暴露；它不会替你决定 Tool 粒度、权限、错误恢复与当前 Tool Set。</text></g></svg>