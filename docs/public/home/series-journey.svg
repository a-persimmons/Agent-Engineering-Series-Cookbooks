<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" role="img" aria-labelledby="title desc">
<title id="title">Agent Engineering Series 学习路径</title>
<desc id="desc">从 Prompt、Context、Agent、Harness 到 Evaluation 的五册递进式学习地图。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f7fbf8"/>
    <stop offset="100%" stop-color="#edf6f1"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#244537" flood-opacity=".10"/>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0 0L9 4.5 0 9z" fill="#2f6b50"/>
  </marker>
</defs>

<rect width="920" height="660" rx="34" fill="url(#bg)"/>
<circle cx="755" cy="118" r="170" fill="#dfeee6" opacity=".55"/>
<circle cx="138" cy="570" r="200" fill="#e5f2eb" opacity=".65"/>

<g font-family="system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <text x="62" y="72" font-size="18" font-weight="700" fill="#2f6b50">SERIES ROADMAP</text>
  <text x="62" y="116" font-size="31" font-weight="750" fill="#21342b">从一次模型调用，走到可持续改进的 AI 系统</text>
  <text x="62" y="151" font-size="17" fill="#63736b">五册不是五个孤立主题，而是一条不断扩大的工程视角。</text>

  <path d="M110 545 C230 520, 290 475, 375 455 C485 430, 560 385, 650 350 C735 318, 785 270, 830 225"
        fill="none" stroke="#2f6b50" stroke-width="4" stroke-linecap="round"/>
  <g fill="#2f6b50">
    <circle cx="122" cy="542" r="8"/><circle cx="298" cy="480" r="8"/>
    <circle cx="472" cy="420" r="8"/><circle cx="650" cy="350" r="8"/><circle cx="820" cy="235" r="8"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="330" width="145" height="160" rx="22" fill="#ffffff" stroke="#d5e9df"/>
    <rect x="232" y="285" width="145" height="160" rx="22" fill="#ffffff" stroke="#d9e6f4"/>
    <rect x="394" y="240" width="145" height="160" rx="22" fill="#ffffff" stroke="#e2ddf5"/>
    <rect x="556" y="195" width="145" height="160" rx="22" fill="#ffffff" stroke="#f0e1d2"/>
    <rect x="718" y="150" width="145" height="160" rx="22" fill="#ffffff" stroke="#f0d9dc"/>
  </g>

  <g text-anchor="middle">
    <circle cx="142" cy="365" r="21" fill="#e6f6ed"/>
    <text x="142" y="372" font-size="24">💡</text>
    <text x="142" y="408" font-size="15" font-weight="700" fill="#2f6b50">系列1</text>
    <text x="142" y="436" font-size="21" font-weight="750" fill="#1f2d26">Prompt</text>
    <text x="142" y="462" font-size="13" fill="#66776e">控制一次模型行为</text>

    <circle cx="304" cy="320" r="21" fill="#eaf3ff"/>
    <text x="304" y="327" font-size="23">📄</text>
    <text x="304" y="363" font-size="15" font-weight="700" fill="#4d75a6">系列2</text>
    <text x="304" y="391" font-size="21" font-weight="750" fill="#1f2d26">Context</text>
    <text x="304" y="417" font-size="13" fill="#66776e">让模型看到对的世界</text>

    <circle cx="466" cy="275" r="21" fill="#f0ebff"/>
    <text x="466" y="282" font-size="23">🧭</text>
    <text x="466" y="318" font-size="15" font-weight="700" fill="#7356a6">系列3</text>
    <text x="466" y="346" font-size="21" font-weight="750" fill="#1f2d26">Agent</text>
    <text x="466" y="372" font-size="13" fill="#66776e">持续决策与行动</text>

    <circle cx="628" cy="230" r="21" fill="#fff1e5"/>
    <text x="628" y="237" font-size="23">⚙️</text>
    <text x="628" y="273" font-size="15" font-weight="700" fill="#b76a2f">系列4</text>
    <text x="628" y="301" font-size="21" font-weight="750" fill="#1f2d26">Harness</text>
    <text x="628" y="327" font-size="13" fill="#66776e">可控 · 可恢复 · 可观察</text>

    <circle cx="790" cy="185" r="21" fill="#fff0f1"/>
    <text x="790" y="192" font-size="23">📊</text>
    <text x="790" y="228" font-size="15" font-weight="700" fill="#b65359">系列5</text>
    <text x="790" y="256" font-size="21" font-weight="750" fill="#1f2d26">Evaluation</text>
    <text x="790" y="282" font-size="13" fill="#66776e">用证据驱动持续改进</text>
  </g>

  <g font-size="13" fill="#5c6e64" text-anchor="middle">
    <text x="130" y="588">对齐目标 · 定义任务</text>
    <text x="305" y="535">选择信息 · 管理上下文</text>
    <text x="480" y="482">规划行动 · 调用工具</text>
    <text x="650" y="405">工程约束 · 可靠运行</text>
    <text x="805" y="340">评测结果 · 沉淀能力</text>
  </g>

  <g transform="translate(695 510)">
    <rect width="170" height="70" rx="20" fill="#2f6b50"/>
    <text x="85" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#dcece4">END STATE</text>
    <text x="85" y="51" text-anchor="middle" font-size="17" font-weight="750" fill="#ffffff">可持续进化的 AI 系统</text>
  </g>
  <path d="M820 310 C850 365 838 430 790 495" fill="none" stroke="#2f6b50" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
</g>
</svg>